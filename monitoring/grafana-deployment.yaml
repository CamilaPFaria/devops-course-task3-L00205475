apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1 #creates one pod
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000 #exposes the port for the grafana web interface