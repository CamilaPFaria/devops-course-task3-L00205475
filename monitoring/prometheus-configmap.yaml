apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'pet-catalog'
        metrics_path: '/api/metrics/'
        static_configs:
          - targets: ['pet-catalog-service.default.svc.cluster.local:8000']