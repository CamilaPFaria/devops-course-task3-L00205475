name: Run the unit tests #name of the worflow
on:
  pull_request: #it triggers everytime there is a pull request pointing to the main branch
    branches:
      - main
  push: #add this as best practise - direct commits to main
    branches:
      - main    

jobs: 
  test:
    runs-on: ubuntu-latest 

    steps: #this step checks-out the repositoy under $GITHUB_WORKSPACE, so GitHub actions runner can access it.
      - name: Checkout code #Ref.: https://github.com/actions/checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7 #Ref.: https://github.com/actions/setup-python
        with:
          python-version: '3.13' #value comes from the documentation refered above

      - name: Install dependencies #step to install all dependencies listed on the requirements.txt file
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest and generate reports
        run: |
          mkdir -p reports
          pytest \
            --html=reports/report.html \
            --self-contained-html \
            --cov=api \
            --cov-report=html:htmlcov \
            --cov-report=term-missing

      - name: upload test reports #Ref.: https://github.com/actions/upload-artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-reports
          path: |
            reports/
            htmlcov/
          retention-days: 30      
          
      